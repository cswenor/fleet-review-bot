name: Bot CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # test.env is fixture authority, not this fork's production identity.
      - run: env -u GITHUB_REPOSITORY node --env-file=bot/test.env --test --test-concurrency=4 bot/*.test.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Build the real candidate image; publication and deployment require a
      # separately authorized release with an immutable source and image digest.
      - run: docker build --platform linux/amd64 --build-arg "GIT_SHA=$GITHUB_SHA" -f bot/Dockerfile .
